{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Manager{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% bootstrap_css %}
    <style>
        :root {
            --accent-1: #8b5cf6;
            --accent-2: #06b6d4;
        }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #312e81, transparent 50%),
                radial-gradient(circle at bottom right, #0e7490, transparent 50%),
                #0f172a;
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        .gradient-text {
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        .btn-gradient {
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border: 0;
            color: #fff;
            font-weight: 500;
            transition: transform .2s, box-shadow .2s;
        }
        .btn-gradient:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.45);
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-hover-bg: rgba(255, 255, 255, 0.06);
        }
        .table thead th {
            color: var(--accent-2);
            text-transform: uppercase;
            font-size: .8rem;
            letter-spacing: .08em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 .2rem rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body>
    <nav class="navbar border-bottom border-secondary-subtle">
        <div class="container">
            <span class="navbar-brand gradient-text fs-4">🎓 Student Manager</span>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    {% bootstrap_javascript %}
</body>
</html>
